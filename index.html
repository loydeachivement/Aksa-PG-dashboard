<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Aksa I&C dashboard view</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ----- Global Reset & Base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }

    /* Allow the page to scroll vertically as a whole document */
    html, body {
      height: auto;
      min-height: 100%;
      width: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      background: #0b1219;
      display: block; /* no more centering */
      transition: background 0.2s ease;
    }

    /* ----- Login view ----- */
    .login-view {
      min-height: 100vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    /* ----- Card Base (Login) ----- */
    .card {
      background: rgba(20, 30, 45, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 2rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.06);
      width: 100%;
      max-width: 420px;
      color: #f0f4fa;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.25s ease;
    }

    .login-card h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff, #b0c7e0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-card .subhead {
      font-size: 0.9rem;
      color: #9eb1c9;
      margin-bottom: 2rem;
      border-left: 3px solid #4b8cff;
      padding-left: 0.75rem;
    }

    .input-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 0.45rem;
      color: #b8cbe0;
      letter-spacing: 0.3px;
    }

    .input-group i.field-icon {
      position: absolute;
      left: 1rem;
      top: 2.45rem;
      color: #6e8bb0;
      font-size: 0.95rem;
      pointer-events: none;
    }

    .input-group input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.8rem;
      background: #0e1a28;
      border: 1px solid #253a52;
      border-radius: 1.2rem;
      font-size: 0.95rem;
      color: #fff;
      outline: none;
      transition: 0.2s;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .input-group input:focus {
      border-color: #3f7ef0;
      box-shadow: 0 0 0 3px rgba(63, 126, 240, 0.2), inset 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .input-group input::placeholder {
      color: #556b84;
      font-weight: 300;
      font-size: 0.85rem;
    }

    .toggle-password {
      position: absolute;
      right: 1rem;
      top: 2.45rem;
      background: transparent;
      border: none;
      color: #6e8bb0;
      font-size: 1rem;
      cursor: pointer;
      padding: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
      z-index: 2;
    }

    .toggle-password:hover {
      color: #b0c7e0;
    }

    .password-wrapper input {
      padding-right: 3rem;
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 1.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      background: linear-gradient(135deg, #2f6fdf, #1a4fb0);
      color: white;
      box-shadow: 0 8px 18px -6px #0a1d3a;
      transition: all 0.2s ease;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    .btn:hover {
      background: linear-gradient(135deg, #3b7ef0, #245ec9);
      transform: scale(1.01);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .error-message {
      background: rgba(220, 38, 38, 0.15);
      border-left: 4px solid #b91c1c;
      color: #fca5a5;
      padding: 0.7rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.85rem;
      margin: 1rem 0 0.5rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
    }

    /* ----- Dashboard (page scrolls as a whole) ----- */
    .dashboard-fullscreen {
      display: none;
      position: relative;
      min-height: 100vh;
      width: 100%;
      background: #0b1219;
      flex-direction: column;
      /* NOT overflow hidden — the page body scrolls */
    }

    /* Sticky topbar */
    .dashboard-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.5rem;
      background: rgba(10, 18, 28, 0.98);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #1f2f42;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .dashboard-topbar .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: #e3ecf5;
      font-weight: 500;
      font-size: 1.1rem;
    }

    .dashboard-topbar .brand i {
      color: #3f7ef0;
      font-size: 1.4rem;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .user-badge {
      background: rgba(63, 126, 240, 0.12);
      padding: 0.45rem 1.1rem;
      border-radius: 30px;
      border: 1px solid #2a5ab0;
      font-weight: 500;
      color: #c2d6ff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .user-badge i {
      font-size: 0.9rem;
      color: #5f8de0;
    }

    .user-badge .username-text {
      font-weight: 600;
      color: #ffffff;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid #3a4e66;
      color: #b8c8dd;
      padding: 0.45rem 1.1rem;
      border-radius: 30px;
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      white-space: nowrap;
    }

    .logout-btn:hover {
      background: rgba(220, 38, 38, 0.2);
      border-color: #b91c1c;
      color: #ffb3b3;
    }

    /* ----- Zoom buttons (in top bar) ----- */
    .zoom-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid #3a4e66;
      background: transparent;
      color: #b8c8dd;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      flex-shrink: 0;
    }

    .zoom-btn:hover {
      background: rgba(63, 126, 240, 0.15);
      border-color: #3f7ef0;
      color: #c2d6ff;
    }

    .zoom-btn:active {
      transform: scale(0.92);
      background: rgba(63, 126, 240, 0.35);
    }

    .zoom-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    @media (max-width: 768px) {
      .zoom-btn {
        display: flex;
      }
    }

    /* ----- Iframe container ----- */
    .iframe-wrapper {
      width: 100%;
      position: relative;
      overflow-x: auto;
      overflow-y: hidden; /* we don't need internal vertical scroll — the PAGE scrolls */
      background: #0b1219;
      -webkit-overflow-scrolling: touch;
    }

    .iframe-stage {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .iframe-stage iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      pointer-events: auto;
    }

    /* Desktop: iframe fills a tall area of the page */
    @media (min-width: 769px) {
      .iframe-wrapper {
        height: calc(100vh - 64px);
        min-height: 600px;
      }
    }

    /* Mobile: iframe area becomes very tall so the WHOLE PAGE scrolls vertically */
    @media (max-width: 768px) {
      .iframe-wrapper {
        height: auto; /* the stage defines the height */
        overflow-x: auto;
        overflow-y: hidden; /* page scrolls vertically */
        touch-action: pan-x pan-y;
      }

      .iframe-stage {
        display: block;
        width: auto;
        height: auto;
      }

      .iframe-stage iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 1024px !important;
        height: 1600px !important;
        transform-origin: 0 0;
        pointer-events: auto;
      }

      .iframe-stage {
        position: relative;
      }
    }

    /* Responsive adjustments for login card */
    @media (max-width: 600px) {
      .card {
        padding: 2rem 1.5rem;
        border-radius: 1.8rem;
        max-width: 92%;
      }
      .login-card h1 {
        font-size: 1.8rem;
      }
      .input-group i.field-icon {
        top: 2.3rem;
      }
      .toggle-password {
        top: 2.3rem;
      }

      .dashboard-topbar {
        padding: 0.7rem 1rem;
      }
      .dashboard-topbar .brand span {
        display: none;
      }
      .dashboard-topbar .brand i {
        font-size: 1.6rem;
      }
      .user-badge {
        padding: 0.45rem 0.9rem;
        font-size: 0.8rem;
      }
      .user-badge .username-text {
        max-width: 80px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .logout-btn {
        padding: 0.45rem 0.9rem;
      }
      .logout-btn span {
        display: none;
      }
    }

    @media (max-width: 480px) {
      input, button {
        font-size: 16px !important;
      }
    }
  </style>
</head>
<body>

  <!-- LOGIN VIEW -->
  <div id="loginView" class="login-view">
    <div id="loginCard" class="card login-card">
      <h1>Welcome back</h1>
      <div class="subhead">Sign in to access your dashboard</div>

      <div class="input-group">
        <label for="username">Username</label>
        <i class="fas fa-user field-icon"></i>
        <input type="text" id="username" placeholder="Enter username" autocomplete="username">
      </div>

      <div class="input-group password-wrapper">
        <label for="password">Password</label>
        <i class="fas fa-lock field-icon"></i>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        <button type="button" id="togglePassword" class="toggle-password" aria-label="Toggle password visibility">
          <i class="fas fa-eye" id="eyeIcon"></i>
        </button>
      </div>

      <button id="loginBtn" class="btn">
        <i class="fas fa-arrow-right-to-bracket"></i> Log In
      </button>

      <div id="errorMsg" class="error-message">
        <i class="fas fa-circle-exclamation"></i>
        <span id="errorText">Invalid credentials. Please try again.</span>
      </div>
    </div>
  </div>

  <!-- DASHBOARD (page scrolls, topbar sticky) -->
  <div id="dashboardFullscreen" class="dashboard-fullscreen">
    <div class="dashboard-topbar">
      <div class="brand">
        <i class="fas fa-table-columns"></i>
        <span>Data Dashboard</span>
      </div>
      <div class="topbar-actions">
        <button class="zoom-btn" id="zoomOutBtn" aria-label="Zoom out" disabled>
          <i class="fas fa-minus"></i>
        </button>
        <button class="zoom-btn" id="zoomInBtn" aria-label="Zoom in">
          <i class="fas fa-plus"></i>
        </button>
        <div class="user-badge">
          <i class="fas fa-circle-user"></i>
          <span class="username-text" id="displayUsername">User</span>
        </div>
        <button id="logoutBtn" class="logout-btn">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </button>
      </div>
    </div>

    <div class="iframe-wrapper" id="iframeWrapper">
      <div class="iframe-stage" id="iframeStage">
        <iframe id="sheetIframe"
                src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTM1w-KU7CTbTDA2iw3jZkQVtK8HNr0kSjMQvITXyUHEEfovbyFBR37_t6h3__C7w/pubhtml?widget=true&amp;headers=false"></iframe>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ========== CONFIG ==========
      const VALID_USERS = {
        'Tamer': 'aksa2026$',
        'Loyde': 'aksa2026$'
      };

      // DOM
      const loginView = document.getElementById('loginView');
      const loginCard = document.getElementById('loginCard');
      const dashboardFullscreen = document.getElementById('dashboardFullscreen');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const loginBtn = document.getElementById('loginBtn');
      const errorMsgDiv = document.getElementById('errorMsg');
      const errorTextSpan = document.getElementById('errorText');
      const logoutBtn = document.getElementById('logoutBtn');
      const displayUsername = document.getElementById('displayUsername');
      const togglePasswordBtn = document.getElementById('togglePassword');
      const eyeIcon = document.getElementById('eyeIcon');
      const iframeWrapper = document.getElementById('iframeWrapper');
      const iframeStage = document.getElementById('iframeStage');
      const sheetIframe = document.getElementById('sheetIframe');
      const zoomInBtn = document.getElementById('zoomInBtn');
      const zoomOutBtn = document.getElementById('zoomOutBtn');

      // ========== PASSWORD TOGGLE ==========
      let passwordVisible = false;
      togglePasswordBtn.addEventListener('click', () => {
        passwordVisible = !passwordVisible;
        passwordInput.type = passwordVisible ? 'text' : 'password';
        eyeIcon.classList.toggle('fa-eye', !passwordVisible);
        eyeIcon.classList.toggle('fa-eye-slash', passwordVisible);
        passwordInput.focus();
      });

      // ========== HELPERS ==========
      function showError(message) {
        errorTextSpan.textContent = message;
        errorMsgDiv.style.display = 'flex';
        setTimeout(() => { errorMsgDiv.style.display = 'none'; }, 4000);
      }
      function clearError() { errorMsgDiv.style.display = 'none'; }

      // ========== LOGIN ==========
      function performLogin() {
        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) {
          showError('Please enter both username and password.');
          return;
        }

        if (VALID_USERS.hasOwnProperty(username) && VALID_USERS[username] === password) {
          loginView.style.display = 'none';
          dashboardFullscreen.style.display = 'flex';
          displayUsername.textContent = username;

          passwordInput.type = 'password';
          passwordVisible = false;
          eyeIcon.classList.add('fa-eye');
          eyeIcon.classList.remove('fa-eye-slash');
          usernameInput.value = '';
          passwordInput.value = '';
          clearError();

          // Scroll page to top on login
          window.scrollTo(0, 0);

          setTimeout(initZoom, 100);
        } else {
          showError('Invalid username or password. Please try again.');
          passwordInput.value = '';
          passwordInput.focus();
        }
      }

      // ========== LOGOUT ==========
      function performLogout() {
        dashboardFullscreen.style.display = 'none';
        loginView.style.display = 'flex';

        passwordInput.type = 'password';
        passwordVisible = false;
        eyeIcon.classList.add('fa-eye');
        eyeIcon.classList.remove('fa-eye-slash');
        usernameInput.value = '';
        passwordInput.value = '';
        clearError();
        usernameInput.focus();

        resetForDesktop();
        window.scrollTo(0, 0);
      }

      loginBtn.addEventListener('click', performLogin);
      usernameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); passwordInput.focus(); }
      });
      passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); performLogin(); }
      });
      logoutBtn.addEventListener('click', performLogout);
      usernameInput.addEventListener('input', clearError);
      passwordInput.addEventListener('input', clearError);
      window.addEventListener('load', () => usernameInput.focus());

      // =====================================================
      // ZOOM ENGINE
      // Mobile: stage width = 1024*scale (horizontal scroll inside wrapper)
      //         stage height = 1600*scale (page grows → vertical page scroll)
      // =====================================================
      const zoomState = {
        scale: 1,
        minScale: 0.2,
        maxScale: 5,
        baseScale: 1,
        mode: 'desktop'
      };

      const VIRTUAL_W = 1024;
      const VIRTUAL_H = 1600;

      function isMobileViewport() {
        return window.matchMedia('(max-width: 768px)').matches;
      }

      function resetForDesktop() {
        zoomState.scale = 1;
        zoomState.baseScale = 1;
        zoomState.mode = 'desktop';
        iframeStage.style.width = '';
        iframeStage.style.height = '';
        sheetIframe.style.transform = 'none';
        iframeWrapper.style.height = '';
        iframeWrapper.scrollLeft = 0;
        iframeWrapper.scrollTop = 0;
        updateZoomButtons();
      }

      function computeBaseScale() {
        const w = iframeWrapper.clientWidth;
        return w / VIRTUAL_W;
      }

      // Mobile: set the stage size so the wrapper is wide enough for horizontal scroll,
      // AND tall enough that the whole PAGE scrolls vertically.
      function applyStageSize() {
        if (zoomState.mode !== 'mobile') return;
        const s = zoomState.scale;
        iframeStage.style.width = (VIRTUAL_W * s) + 'px';
        iframeStage.style.height = (VIRTUAL_H * s) + 'px';
        sheetIframe.style.transform = `scale(${s})`;
        sheetIframe.style.transformOrigin = '0 0';
        // The wrapper's height = stage height so page grows with it
        iframeWrapper.style.height = (VIRTUAL_H * s) + 'px';
      }

      function updateZoomButtons() {
        if (zoomState.mode !== 'mobile') {
          zoomInBtn.disabled = true;
          zoomOutBtn.disabled = true;
          return;
        }
        zoomInBtn.disabled = zoomState.scale >= zoomState.maxScale - 0.001;
        zoomOutBtn.disabled = zoomState.scale <= zoomState.minScale + 0.001;
      }

      // Zoom around the current horizontal scroll center.
      // Vertical center is preserved by the page scroll naturally.
      function zoomBy(factor) {
        if (zoomState.mode !== 'mobile') return;
        const oldScale = zoomState.scale;
        const clamped = Math.min(zoomState.maxScale, Math.max(zoomState.minScale, oldScale * factor));
        if (Math.abs(clamped - oldScale) < 0.0001) return;

        // Horizontal center of the wrapper (in wrapper coords)
        const viewCenterX = iframeWrapper.scrollLeft + iframeWrapper.clientWidth / 2;
        const stageCX = viewCenterX / oldScale;

        // Vertical: track the page scroll position relative to the topbar + wrapper top
        const wrapperRect = iframeWrapper.getBoundingClientRect();
        const pageYInWrapper = Math.max(0, -wrapperRect.top + window.scrollY * 0) +
                               (window.innerHeight / 2 - Math.max(0, wrapperRect.top));
        // Simpler: use current page scroll within wrapper
        const currentPageY = window.scrollY - (iframeWrapper.offsetTop || 0);
        const clampedPageY = Math.max(0, currentPageY + window.innerHeight / 2);
        const stageCY = clampedPageY / oldScale;

        zoomState.scale = clamped;
        applyStageSize();
        updateZoomButtons();

        // Restore horizontal position
        iframeWrapper.scrollLeft = Math.max(0, stageCX * clamped - iframeWrapper.clientWidth / 2);

        // Restore vertical page position
        const newPageY = stageCY * clamped - window.innerHeight / 2;
        window.scrollTo(0, Math.max(0, (iframeWrapper.offsetTop || 0) + newPageY));
      }

      function initZoom() {
        if (isMobileViewport()) {
          zoomState.mode = 'mobile';
          zoomState.baseScale = computeBaseScale();
          zoomState.scale = zoomState.baseScale;
          applyStageSize();
          iframeWrapper.scrollLeft = 0;
          updateZoomButtons();
        } else {
          resetForDesktop();
        }
      }

      // Buttons
      zoomInBtn.addEventListener('click', () => zoomBy(1.3));
      zoomOutBtn.addEventListener('click', () => zoomBy(1 / 1.3));

      // ---- Mode watcher ----
      let lastMode = isMobileViewport() ? 'mobile' : 'desktop';
      let resizeTimer;

      function handleViewportChange() {
        const nowMobile = isMobileViewport();
        const newMode = nowMobile ? 'mobile' : 'desktop';

        if (newMode !== lastMode) {
          lastMode = newMode;
          initZoom();
        } else if (nowMobile && newMode === 'mobile') {
          zoomState.baseScale = computeBaseScale();
          zoomState.scale = Math.min(zoomState.maxScale, Math.max(zoomState.minScale, zoomState.baseScale));
          applyStageSize();
          updateZoomButtons();
        } else if (!nowMobile && newMode === 'desktop') {
          resetForDesktop();
        }
      }

      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(handleViewportChange, 120);
      });

      window.addEventListener('orientationchange', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(handleViewportChange, 200);
      });

      const mq = window.matchMedia('(max-width: 768px)');
      if (mq.addEventListener) {
        mq.addEventListener('change', (e) => {
          lastMode = e.matches ? 'mobile' : 'desktop';
          initZoom();
        });
      } else if (mq.addListener) {
        mq.addListener((e) => {
          lastMode = e.matches ? 'mobile' : 'desktop';
          initZoom();
        });
      }

    })();
  </script>
</body>
</html>
